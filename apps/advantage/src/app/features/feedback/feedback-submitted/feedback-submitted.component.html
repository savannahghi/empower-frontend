<div class="d-flex justify-content-center">
    <nb-card class="col-11 mt-5">
        <div class="p-3" *ngIf="designatedParam">
            <div class="col-12">
                <p
                    class="fs-16 link-primary lh-sm text-start text-sm-center col-12 mt-4 pb-2">
                    Thank you for your feedback
                </p>
            </div>
            <div class="col-12 text-center" style="padding: 2rem 0rem">
                <div class="col-12 text-center">
                    <img
                        src="../../../../assets/images/ok.gif"
                        style="height: 20rem"
                        alt="" />
                </div>
            </div>
        </div>

        <div class="p-3" *ngIf="!designatedParam">
            <div class="col-12">
                <p
                    class="fs-1 link-primary lh-sm text-start text-sm-center col-12 mt-4 pb-2">
                    Broken link
                </p>
                <p
                    class="fs-19 link-primary lh-sm text-start text-sm-center col-12 mt-2 mb-2">
                    Something is wrong with the link that brought you here
                </p>
            </div>
            <div class="col-12 text-center" style="padding: 2rem 0rem">
                <div class="col-12 text-center">
                    <img
                        src="../../../../assets/images/broken.gif"
                        style="height: 20rem"
                        alt="" />
                </div>
            </div>
            <div class="col-12">
                <p
                    class="fs-19 link-primary lh-sm text-start text-sm-center col-12 mt-2 mb-2">
                    Kindly follow the right link <br />See you soon
                </p>
            </div>
        </div>
    </nb-card>
</div>
