<div class="main-cont">
    <div class="col-12 row ps-3 mt-4 pe-4 mb-3">
        <div class="d-flex col flex-column">
            <h5 class="mb-2">
                {{ 'payment_methods.msg_grp.title' | translate }}
            </h5>
            <p class="text-muted">
                {{ 'payment_methods.msg_grp.subtitle' | translate }}
            </p>
        </div>
        <div class="col flex-grow-0">
            <a
                nbButton
                uiSref="app.advantage.settings.payment_methods.new_payment_method"
                status="success"
                size="small"
                uiSrefActive="active fw-semibold">
                {{ 'payment_methods.msg_grp.add' | translate }}
            </a>
        </div>
    </div>
    <div class="col-md-12 ps-sm-3 pe-sm-5 mb-3">
        <sil-table
            [headerActions]="gridActions"
            [headers]="tableHeader"
            [dynamic]="true"
            [has-action]="true"
            [search]="true"
            [rest-fxn]="'list'"
            [rest-api]="'payment-methods'"
            [actions]="actions"
            [defaultQueryArg]="filterParams"
            [rows]="rows">
        </sil-table>
    </div>
</div>
