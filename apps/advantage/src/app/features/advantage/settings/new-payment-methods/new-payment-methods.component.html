<div class="main-cont">
    <div class="col-12 row ps-3 mt-4 pe-4 mb-3">
        <div class="d-flex col flex-column">
            <h5 class="mb-2">
                {{ 'payment_methods.new_payment_method.title' | translate }}
            </h5>
        </div>
        <div class="col flex-grow-0">
            <a
                nbButton
                size="small"
                uiSref="app.advantage.settings.payment_methods"
                status="primary">
                {{ 'shared.buttons.back' | translate }}
            </a>
        </div>
    </div>

    <div class="col-md-12 ps-sm-3 pe-sm-5 mb-3">
        <nb-card>
            <nb-card-body *ngIf="formConfig.checkExpressionOn">
                <div class="col-12 row ps-3 pe-4">
                    <div>
                        <h6 class="mb-2 text-uppercase fs-6 fw-light">
                            {{
                                'payment_methods.new_payment_method.title'
                                    | translate
                            }}
                        </h6>
                        <p class="text-muted fs-8">
                            {{
                                'payment_methods.new_payment_method.form.subtitle'
                                    | translate
                            }}
                        </p>
                    </div>

                    <skika-form
                        btnContClass="modal-btn-cont"
                        [checkExpressionOn]="formConfig.checkExpressionOn"
                        [disableSubmit]="loading"
                        [service]="true"
                        [submitted]="submitted"
                        [model]="paymentMethodDetails"
                        [cancelBtn]="true"
                        (cancelFxn)="goToPaymentMethodsList()"
                        (submitModel)="submitPaymentMethod($event)"
                        [resetModel]="true"
                        [btnText]="btnText | translate"
                        cancelText="{{ 'shared.buttons.cancel' | translate }}"
                        store="{{ 'addPaymentMethodFieldsService' }}">
                    </skika-form>
                </div>
            </nb-card-body>
        </nb-card>
    </div>
</div>
