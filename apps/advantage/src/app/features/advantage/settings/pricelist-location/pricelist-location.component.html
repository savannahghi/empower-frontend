<!-- Modal for adding location -->
<skika-dialogue
    *ngIf="toggle['addLocation']"
    [small]="true"
    [showHeading]="false"
    [showHeaderAction]="false"
    (toggleModal)="toggleModal('addLocation')">
    <div class="p-3">
        <div class="mb-4">
            <h5 class="mb-0">
                {{ 'pricelists.locations.add_location' | translate }}
            </h5>
        </div>
        <skika-form
            btnContClass="modal-btn-cont"
            [service]="true"
            [cancelBtn]="true"
            (cancelFxn)="toggleModal('addLocation')"
            (submitModel)="saveLocation($event)"
            [resetModel]="true"
            [btnText]="'shared.buttons.save' | translate"
            cancelText="{{ 'shared.buttons.cancel' | translate }}"
            store="{{ 'addPricelistLocationForm' }}">
        </skika-form>
    </div>
</skika-dialogue>

<!-- Main layout -->
<div class="main-cont">
    <div class="col-12 row ps-3 mt-4 pe-4 mb-3">
        <div class="d-flex col flex-column">
            <h5 class="mb-2">
                {{ 'pricelists.locations.title' | translate }}
            </h5>
            <p class="text-muted">
                {{ 'pricelists.locations.subtitle' | translate }}
            </p>
        </div>
        <div class="col flex-grow-0">
            <button
                nbButton
                status="primary"
                size="small"
                class="fw-semibold success"
                (click)="addLocation()">
                {{ 'pricelists.locations.add_location' | translate }}
            </button>
        </div>
    </div>
    <div class="col-md-12 ps-sm-3 pe-sm-5 mb-3">
        <sil-table
            [headers]="tableHeader"
            [actions]="actions"
            [apilist]="locations"
            [rows]="rows"
            [dynamic]="false"
            [has-action]="true"
            [search]="false"
            [ignoreDisplayFilters]="[
                'id',
                'step',
                'page',
                'page_size',
                'pricelist_type'
            ]">
        </sil-table>
    </div>
</div>
