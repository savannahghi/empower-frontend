<!-- sweetalert for retiring an operation region -->
<swal
    #retireOperatingRegion
    title="Retire Operating region"
    [text]="operatingRegionText"
    [showCancelButton]="true"
    [confirmButtonText]="'Retire'"
    [cancelButtonText]="'Cancel'"
    [cancelButtonColor]="'#edf1f7'"
    [confirmButtonColor]="'#603a8b'"
    [focusCancel]="true"
    (confirm)="confirmUpdate()">
</swal>

<!-- sweetalert for activating an operation region -->
<swal
    #activateOperatingRegion
    title="Activate Operating region"
    [text]="operatingRegionText"
    [showCancelButton]="true"
    [confirmButtonText]="'Activate'"
    [cancelButtonText]="'Cancel'"
    [cancelButtonColor]="'#edf1f7'"
    [confirmButtonColor]="'#603a8b'"
    [focusCancel]="true"
    (confirm)="confirmUpdate()">
</swal>

<skika-dialogue
    *ngIf="showAddRegionModal"
    heading="Add region"
    (toggleModal)="toggleAddRegion()">
    <div
        class="col-md-12 m-auto w-75 mb-5 d-flex align-items-center justify-content-center">
        <skika-form
            [checkExpressionOn]="formConfig.checkExpressionOn"
            [submitted]="submitted"
            [cancelBtn]="true"
            [disableSubmit]="loading"
            (formOptions)="getFormOptions($event)"
            (submitModel)="addOperatingRegions($event)"
            (cancelFxn)="toggleAddRegion()"
            [resetModel]="true"
            [service]="true"
            btnText="{{ 'shared.buttons.save' | translate }}"
            cancelText="{{ 'shared.buttons.cancel' | translate }}"
            store="{{ 'operatingRegionsService' }}">
        </skika-form>
    </div>
</skika-dialogue>
<div class="main-cont">
    <div class="col-12 row ps-sm-3 mt-4 pe-sm-4 mb-3 div-sub">
        <div class="d-flex col flex-column">
            <h5 class="mb-2">
                {{ 'settings.regions.title' | translate }}
            </h5>
            <p class="text-muted">
                {{ 'settings.regions.subtitle' | translate }}
            </p>
        </div>
        <div class="col flex-grow-0">
            <button
                nbButton
                shape="rectangle"
                size="small"
                status="primary"
                (click)="toggleAddRegion()">
                {{ 'shared.buttons.add_' | translate }}
                {{ 'settings.regions.title' | translate }}
            </button>
        </div>

        <sil-table
            [headerActions]="gridActions"
            [headers]="tableHeader"
            [dynamic]="true"
            [has-action]="true"
            [search]="true"
            [rest-fxn]="'list'"
            [rest-api]="'operating-regions'"
            [actions]="actions"
            [defaultQueryArg]="filterParams"
            (customFxn)="toggleRetireOR($event)"
            [rows]="rows">
        </sil-table>
    </div>
</div>
