<div class="main-cont">
    <div class="col-12 row ps-3 mt-4 pe-4 mb-3">
        <div class="d-flex col flex-column">
            <h5 class="mb-2">Referrals</h5>
            <p class="text-muted">Outgoing referrals for this facility</p>
        </div>
    </div>
    <div class="col-md-12 ps-sm-3 pe-sm-5">
        <sil-table
            [headers]="tableHeader"
            [statusFilters]="statusFilters"
            [rest-fxn]="'list'"
            [rest-api]="'referrals'"
            [dynamic]="true"
            [has-action]="true"
            [actions]="actions"
            [defaultQueryArg]="filterParams"
            [search]="true"
            [searchParam]="'patient'"
            [ignoreDisplayFilters]="['id', 'after', 'before', 'status']"
            [isGraphqlEndpoint]="true"
            [rows]="rows"
            (customFxn)="viewReferralForm($event)"
            (filtersArg)="setFilter($event)"
            [ignoreStateParams]="['id']"
            [filter]="'filterService'">
            >
        </sil-table>
    </div>
</div>
