<div class="main-cont">
    <div class="col-12 row ps-3 mt-4 pe-4 mb-3">
        <div class="d-flex col flex-column">
            <h5 class="mb-2">Referrals</h5>
            <p class="text-muted">
                Incoming and Outgoing referrals for this facility
            </p>
        </div>
    </div>
    <div class="col-md-12 ps-sm-3 pe-sm-5">
        <sil-table
            [headers]="tableHeader"
            [rest-fxn]="'list'"
            [rest-api]="'hie-referrals'"
            [dynamic]="true"
            [has-action]="true"
            [actions]="actions"
            [statusFilters]="statusFilters"
            [defaultQueryArg]="filterParams"
            [ignoreDisplayFilters]="['id', 'after', 'before']"
            [rows]="rows"
            (customFxn)="viewReferralForm($event)">
        </sil-table>
    </div>
</div>
