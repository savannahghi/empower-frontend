<div [ngClass]="isChild ? 'px-0' : 'px-4'">
    <nb-card
        class="p-3"
        [ngClass]="isChild ? 'border-0' : 'border-radius-top-corners'">
        <nb-card-body class="border-none bg-transparent">
            @if(!this.resolvedPatientId) {
            <div class="row mt-3">
                <div
                    class="col-sm-1 mt-3 mb-3 justify-content-center d-flex m-sm-3 m-0">
                    <ngx-skeleton-loader
                        count="1"
                        [theme]="{ height: '97px', width: '97px' }"
                        appearance="circle"></ngx-skeleton-loader>
                </div>
                <div
                    class="col-12 col-xs-12 col-sm-10 pt-3 pb-3 align-self-center text-center text-sm-start">
                    <div class="patient-data-loader">
                        <ngx-skeleton-loader
                            count="3"
                            appearance="line"></ngx-skeleton-loader>
                    </div>
                </div>
                <div
                    class="col-12 pt-3 pb-3 align-self-center text-center text-sm-start">
                    <div class="patient-data-loader">
                        <ngx-skeleton-loader
                            count="3"
                            appearance="line"></ngx-skeleton-loader>
                    </div>
                </div>
            </div>
            }@else {

            <div class="w-100" [ngClass]="isChild ? '' : 'pe-xl-5'">
                <h3 class="title">
                    Perform
                    <span>{{ resolvedCancerType | titleCase }} Cancer</span>
                    {{
                        this.screeningAction === 'examinations'
                            ? 'Examination'
                            : 'Diagnostic Test'
                    }}
                </h3>
                <label class="input-label mb-4">
                    {{
                        this.screeningAction === 'examinations'
                            ? 'Perform the Examination'
                            : 'Order diagnostic test'
                    }}
                </label>

                <ngx-visit-test-cervical
                    *ngIf="resolvedCancerType === 'cervical'"
                    [screeningAction]="screeningAction"
                    [encounterId]="encounterId"
                    [isChild]="true"
                    (customFxn)="cancelFxn()"
                    (nextScreeningStepRequested)="requestNextScreeningStep()"
                    [cancerType]="'cervical'"
                    [patientID]="resolvedPatientId"></ngx-visit-test-cervical>

                <ngx-visit-test-prostate
                    *ngIf="resolvedCancerType === 'prostate'"
                    [screeningAction]="screeningAction"
                    [encounterId]="encounterId"
                    [isChild]="true"
                    (customFxn)="cancelFxn()"
                    (nextScreeningStepRequested)="requestNextScreeningStep()"
                    [cancerType]="'prostate'"
                    [patientID]="resolvedPatientId"></ngx-visit-test-prostate>

                <div
                    *ngIf="
                        !resultSavedForLater && resolvedCancerType === 'breast'
                    ">
                    <div>
                        @if(screeningAction === 'examinations') {
                        <skika-form
                            btnContClass="modal-btn-center"
                            [resetModel]="true"
                            [modelData]="model"
                            [disableSubmit]="loading"
                            [service]="true"
                            [saveText]="false"
                            (getModelData)="getModelData($event)"
                            store="{{ 'breastCancerExamination' }}">
                        </skika-form
                        >} @else {
                        <skika-form
                            btnContClass="modal-btn-center"
                            [resetModel]="true"
                            [modelData]="model"
                            [disableSubmit]="loading"
                            [service]="true"
                            [saveText]="false"
                            (getModelData)="getModelData($event)"
                            store="{{ 'breastCancerService' }}">
                        </skika-form>
                        }
                    </div>

                    <div
                        class="mt-sm-1 mt-1 py-3 d-sm-flex flex-sm-row justify-content-end">
                        <button
                            nbButton
                            (click)="goToBack(false)"
                            class="actionBtn primaryColor secondaryColor"
                            shape="rectangle"
                            size="medium"
                            status="secondary">
                            Back
                        </button>
                        <a
                            nbButton
                            *ngIf="!servicerequestId"
                            (click)="submitData()"
                            class="actionBtn ms-sm-3 primaryBgColor"
                            shape="rectangle"
                            size="medium"
                            [ngClass]="'primaryBgColor'"
                            [nbSpinner]="savingResult || uploadingFile"
                            nbSpinnerSize="giant"
                            nbSpinnerStatus="primary"
                            status="primary">
                            <span *ngIf="!uploadingFile">Submit</span>
                            <span *ngIf="uploadingFile"
                                >Uploading Files...</span
                            >
                        </a>
                    </div>
                </div>
            </div>
            }
        </nb-card-body>
    </nb-card>
</div>
