<div class="container">
    <div class="block-headers">
        <h5 class="block-text text-muted">
            {{ 'clinics.availability.block_calendar' | translate }}
        </h5>
        <p class="block-subtext text-muted">
            {{ 'clinics.availability.block_calendar_title' | translate }}
        </p>

        <div class="button-container">
            <button
                nbButton
                shape="rectangle"
                target="_blank"
                size="large"
                class="me-3"
                status="primary"
                (click)="showForm('single')">
                Block Single Date
            </button>

            <button
                nbButton
                shape="rectangle"
                target="_blank"
                size="large"
                class="me-3"
                status="primary"
                (click)="showForm('multiple')">
                Block Multiple Dates
            </button>
        </div>
    </div>
</div>

<skika-dialogue
    *ngIf="showModal"
    [heading]="formType === 'unblock' ? 'Unblock Calendar' : 'Block Calendar'"
    (toggleModal)="toggleModal()">
    <div
        *ngIf="formType === 'multiple' || formType === 'unblock'"
        class="fo rm-group row no-gutters">
        <label for="startDate" class="col-sm-2 col-form-label text-muted"
            >Start Date:</label
        >
        <div class="col-sm-4">
            <input
                id="startDate"
                nbInput
                placeholder="Select Start Date"
                [nbDatepicker]="startDatePicker" />
            <nb-datepicker
                (dateChange)="handleDateChange($event, 'startDate')"
                [min]="rawDate"
                #startDatePicker>
            </nb-datepicker>
        </div>
        <label for="endDate" class="col-sm-2 col-form-label text-muted"
            >End Date:</label
        >
        <div class="col-sm-4">
            <input
                id="endDate"
                nbInput
                placeholder="Select End Date"
                [nbDatepicker]="endDatePicker" />
            <nb-datepicker
                (dateChange)="handleDateChange($event, 'endDate')"
                [min]="rawDate"
                #endDatePicker>
            </nb-datepicker>
        </div>
    </div>
    <div *ngIf="formType === 'single'" class="form-group row no-gutters">
        <div class="form-group row no-gutters">
            <label for="datePicker" class="col-sm-2 col-form-label text-muted"
                >Date:</label
            >
            <div class="col-sm-10">
                <input
                    id="datePicker"
                    nbInput
                    placeholder="Select Date"
                    [nbDatepicker]="dateTimePicker" />
                <nb-datepicker
                    (dateChange)="handleDateChange($event, 'selectedDate')"
                    [min]="rawDate"
                    #dateTimePicker>
                </nb-datepicker>
            </div>
        </div>

        <div class="form-group row no-gutters">
            <label for="fromTime" class="col-sm-2 col-form-label text-muted"
                >From:</label
            >
            <div class="col-sm-4">
                <input
                    nbInput
                    type="text"
                    [(ngModel)]="fromTime"
                    [nbTimepicker]="fromTimepicker" />
                <nb-timepicker
                    #fromTimepicker="nbTimepicker"
                    singleColumn
                    [step]="selectedDuration">
                </nb-timepicker>
            </div>
            <label for="toTime" class="col-sm-2 col-form-label text-muted"
                >To:</label
            >
            <div class="col-sm-4">
                <input
                    nbInput
                    type="text"
                    [(ngModel)]="toTime"
                    [nbTimepicker]="toTimepicker" />
                <nb-timepicker
                    #toTimepicker="nbTimepicker"
                    singleColumn
                    [step]="selectedDuration">
                </nb-timepicker>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button
            nbButton
            shape="rectangle"
            target="_blank"
            size="large"
            class="me-3"
            status="basic"
            (click)="toggleModal()">
            Cancel
        </button>
        <button
            nbButton
            shape="rectangle"
            target="_blank"
            size="large"
            class="me-3"
            status="primary"
            [disabled]="isSubmitDisabled()"
            (click)="submitTimeline()">
            Submit
        </button>
    </div>
</skika-dialogue>
