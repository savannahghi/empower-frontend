<div class="main-cont">
    <div class="col-12 row ps-3 mt-4 pe-4 mb-3">
        <div class="d-flex col flex-column">
            <h5 class="mb-2">{{ 'queues.setup' | translate }}</h5>
            <p class="text-muted">{{ 'queues.setup_msg' | translate }}</p>
        </div>
        <div class="col flex-grow-0"></div>
    </div>
    <div class="col-md-12 ps-sm-3 pe-sm-5">
        <sil-table
            [headerActions]="gridActions"
            [headers]="tableHeader"
            [dynamic]="true"
            [has-action]="true"
            [search]="true"
            [rest-fxn]="'list'"
            [rest-api]="'queues'"
            [actions]="actions"
            [ignoreDisplayFilters]="['ordering', 'status', 'queue']"
            [defaultQueryArg]="filterParams"
            [rows]="rows">
        </sil-table>
    </div>
</div>
