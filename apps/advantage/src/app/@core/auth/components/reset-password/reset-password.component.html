<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="">
        <div>
            <div class="col-md-12 d-flex justify-content-center">
                <nb-alert
                    *ngIf="error?.title"
                    class="text-center"
                    outline="warning"
                    style="align-items: center; width: 100%">
                    <div class="row d-inline-flex width-100p col-12">
                        <div class="col flex-grow-0">
                            <span class="fa-stack fa-lg fs-8">
                                <i
                                    class="far fa-circle fa-stack-2x text-warning"></i>
                                <i
                                    class="fas fa-info fa-stack-1x text-warning"></i>
                            </span>
                        </div>
                        <div class="col text-start">
                            <b>{{ error.title }}</b>
                            <br />
                            <span>{{ error.message }}</span>
                        </div>
                    </div>
                </nb-alert>
                <nb-alert
                    *ngIf="notify?.title"
                    class="text-center"
                    status="basic"
                    style="align-items: center; width: 100%">
                    <div class="row d-inline-flex width-100p col-12">
                        <div class="col flex-grow-0">
                            <span class="fa-stack fa-lg fs-8">
                                <i
                                    class="far fa-circle fa-stack-2x text-success"></i>
                                <i
                                    class="fas fa-check fa-stack-1x text-success"></i>
                            </span>
                        </div>
                        <div class="col text-start">
                            <b>{{ notify.title }}</b>
                            <br />
                            <span>{{ notify.message }}</span>
                        </div>
                    </div>
                </nb-alert>
            </div>

            <div class="col-12">
                <div class="ms-3 fw-semibold fs-18 mb-3 col-12 welcome-logo">
                    <img
                        *ngIf="'default' | variant"
                        style="width: 261px; margin-left: -13px"
                        src="../../../../../assets/images/sladeadvantagefull.png"
                        alt="Advantage" />
                    <img
                        *ngIf="'empower' | variant"
                        src="../../../../../assets/images/empower_logo.svg"
                        alt="Empower" />
                </div>
                <div class="ms-3 fw-semibold mb-3 fs-18 col-12 welcome-back">
                    {{ 'reset.reset_password' | translate }}
                </div>
                <div class="ms-3 mb-4 col-12 reset-slogan">
                    {{ 'reset.reset_password_description' | translate }}
                </div>
            </div>

            <form
                [formGroup]="resetPasswordForm"
                (ngSubmit)="onSubmitPassword()">
                <div class="mt-4">
                    <label for="inputEmail" class="mb-1 label text-basic"
                        >Enter New Password</label
                    >
                    <nb-form-field>
                        <nb-icon
                            nbPrefix
                            icon="lock-outline"
                            pack="eva"></nb-icon>
                        <input
                            [type]="getInputType()"
                            placeholder="Enter your new password"
                            nbInput
                            formControlName="password1"
                            [(ngModel)]="password1"
                            name="password1"
                            status="primary"
                            fullWidth
                            fieldSize="large" />
                    </nb-form-field>
                </div>
                <div class="mt-4 mb-2">
                    <label for="inputPassword" class="mb-1 label text-basic"
                        >Confirm New Password</label
                    >
                    <nb-form-field class="col-12">
                        <nb-icon
                            class="mb-2"
                            nbPrefix
                            icon="lock-outline"
                            pack="eva"></nb-icon>
                        <input
                            [type]="getInputType()"
                            placeholder="Re-enter your new password"
                            nbInput
                            formControlName="password2"
                            [(ngModel)]="password2"
                            name="password2"
                            [status]="passwordNotMatch ? 'danger' : 'primary'"
                            fullWidth
                            class="mb-3"
                            fieldSize="large" />
                        <button
                            nbSuffix
                            nbButton
                            ghost
                            class="mb-2"
                            type="button"
                            (click)="toggleShowPassword()">
                            <nb-icon
                                [icon]="
                                    showPassword
                                        ? 'eye-outline'
                                        : 'eye-off-2-outline'
                                "
                                pack="eva"
                                [attr.aria-label]="
                                    showPassword
                                        ? 'hide password'
                                        : 'show password'
                                "
                                class="icon-sp">
                            </nb-icon>
                        </button>
                    </nb-form-field>
                    <span
                        *ngIf="passwordNotMatch"
                        style="
                            color: red;
                            margin-left: 4px;
                            font-size: 12px;
                            font-weight: 600;
                        ">
                        {{ 'reset.passwords_not_match' | translate }}
                    </span>
                </div>
                <div class="mt-3 mb-4">
                    <button
                        [nbSpinner]="loading"
                        [disabled]="loading || !resetPasswordForm.valid"
                        size="large"
                        type="submit"
                        fullWidth
                        status="primary"
                        nbButton>
                        {{ 'reset.reset_password' | translate }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
