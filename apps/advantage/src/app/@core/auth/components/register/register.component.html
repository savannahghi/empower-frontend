<div class="row show-grid dark-bg no-pad">
    <div class="aside"></div>
    <div class="flex-one">
        <div class="logo-cont">
            <div class="img-cont">
                <a href="/" class="logo"></a>
            </div>
            <div class="text-right actions">
                <span>Already have an account?</span>
                &nbsp;&nbsp;
                <button
                    nbButton
                    shape="round"
                    size="small"
                    status="warning"
                    outline
                    routerLink="../login">
                    SIGN IN
                </button>
            </div>
        </div>
        <div class="form-cont">
            <sil-alert
                [errors]="errors"
                [error]="error"
                context="Sign Up"
                [submitted]="submitted"></sil-alert>
            <!-- Form cont -->
            <div class="col-md-12">
                <div class="row show-grid pad-h-60">
                    <div class="">
                        <div class="row">
                            <div class="col-md-12">
                                <h1 class="fs-22 title-color">
                                    Create your account
                                </h1>
                                <div>Kindly complete the details below</div>
                            </div>
                        </div>
                    </div>
                </div>
                <skika-form
                    btnText="JOIN"
                    [submitted]="submitted"
                    config="setPassword"
                    store="register"
                    (submitModel)="receiveModel($event)"></skika-form>
            </div>
            <!-- End of form cont -->
            <div class="col-md-12" style="padding: 2rem"></div>
        </div>
    </div>
</div>
