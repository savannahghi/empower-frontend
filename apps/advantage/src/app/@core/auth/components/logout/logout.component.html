<div class="container">
    <div class="row show-grid dark-bg no-pad">
        <div class="col-xxxl-8 offset-xxl-2 col-lg-8 offset-lg-2 mt-5">
            <nb-card>
                <nb-card-header> </nb-card-header>
                <nb-card-body>
                    <div class="flex-one">
                        <div class="logo-cont">
                            <div class="img-cont">
                                <a href="/" class="logo"></a>
                            </div>
                        </div>
                        <div class="form-cont">
                            <sil-alert
                                [error]="error"
                                context="Sign Up"
                                [submitted]="submitted"></sil-alert>
                            <!-- Form cont -->
                            <div class="col-md-12">
                                <div class="row show-grid pad-h-60">
                                    <div class="col-12">
                                        <div class="row">
                                            <div class="col-md-12">
                                                <h1
                                                    class="fs-18 fw-semibold title-color text-center">
                                                    {{
                                                        'logout.title'
                                                            | translate
                                                    }}
                                                </h1>

                                                <div
                                                    class="col-12 text-center"
                                                    style="
                                                        padding-bottom: 2rem;
                                                    ">
                                                    <img
                                                        src="../../../../../assets/images/login.svg"
                                                        style="height: 10rem"
                                                        alt="" />
                                                </div>
                                                <div class="text-center">
                                                    {{
                                                        'logout.message'
                                                            | translate
                                                    }}
                                                    <i
                                                        class="fas fa-circle-notch fa-spin"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- End of form cont -->
                            <div class="col-md-12" style="padding: 2rem"></div>
                        </div>
                    </div>
                </nb-card-body>
            </nb-card>
        </div>
    </div>
</div>
