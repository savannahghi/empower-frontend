<div class="dashboard-wrapper">
    <!-- Loading state -->
    <div
        *ngIf="loading"
        class="loading-container d-flex justify-content-center align-items-center flex-column">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <span class="text-muted">Loading dashboard...</span>
    </div>

    <!-- Error state -->
    <div
        *ngIf="errorMessage && !loading"
        class="error-container"
        data-testid="error">
        <div class="alert alert-danger">
            <h6><strong>Error Loading Dashboard</strong></h6>
            <p>{{ errorMessage }}</p>
            <div class="mt-3">
                <button
                    class="btn btn-primary retry-button"
                    (click)="retry()"
                    data-testid="retry-button">
                    Retry
                </button>
            </div>
        </div>
    </div>

    <!-- Dashboard using Superset SDK -->
    <div
        class="superset-container"
        [class.visible]="dashboardEmbedded && !loading && !errorMessage">
        <div
            #dashboardContainer
            id="superset-container"
            class="superset-dashboard-container"></div>
    </div>
</div>
