<div class="row">
    <div class="rooms">
        <h4 class="mb-3">Chats</h4>
        <div *ngFor="let room of rooms">
            {{ room.name }}
        </div>
    </div>

    <div
        class="me-4 mt-4 pe-5 messages"
        *ngIf="messages?.length > 0"
        #scrollMe
        [scrollTop]="scrollMe.scrollHeight">
        <div *ngFor="let date of messages">
            <div class="text-center justify-content-center d-flex flex-column">
                <hr class="date-divider" />
                <div class="mb-5" style="position: relative; top: -15px">
                    <span class="timestamp fw-semibold">
                        {{ date.date }}
                    </span>
                </div>
            </div>
            <div *ngFor="let msg of date.data">
                <div
                    class="d-flex row"
                    [ngClass]="
                        msg.sender.userId === userId ? 'flex-row-reverse' : ''
                    ">
                    <div
                        class="col-6 message"
                        [ngClass]="
                            msg.sender.userId === userId
                                ? 'message-response'
                                : ''
                        ">
                        <div class="d-flex justify-content-between fs-7">
                            <div class="d-flex">
                                <div class="fw-normal">
                                    {{ msg.sender.name }}
                                </div>
                            </div>
                        </div>
                        <div
                            class="rendered-message"
                            [innerHTML]="msg.event.content.body"></div>
                        <div class="d-flex flex-row-reverse fs-7">
                            <div class="d-flex flex-row-reverse">
                                <div>
                                    {{ msg.time }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <br /><br />
        </div>
        <div class="col-12">
            <ckeditor
                [editor]="Editor"
                [config]="$any(editorConfig)"
                (change)="onEditorChange($event)"
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="messageBody"
                data="">
            </ckeditor>
        </div>
        <div class="mb-2 mt-2">
            <button
                nbButton
                status="primary"
                [disabled]="messageBody.length < 1"
                (click)="sendMessage()">
                Send Message
            </button>
        </div>
    </div>
</div>
