<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title></title>

        <base href="/" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="icon" type="image/x-icon" href="favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin="" />
        <link
            href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css?family=Mulish:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700&amp;display=swap"
            rel="stylesheet" />
        <link rel="manifest" href="manifest.webmanifest" />

        <meta name="theme-color" content="#1976d2" />
    </head>
    <body>
        <ngx-app>
            <!-- Add clarity -->
            <script type="text/javascript">
                (function (c, l, a, r, i, t, y) {
                    c[a] =
                        c[a] ||
                        function () {
                            (c[a].q = c[a].q || []).push(arguments);
                        };
                    t = l.createElement(r);
                    t.async = 1;
                    t.src = 'https://www.clarity.ms/tag/' + i;
                    y = l.getElementsByTagName(r)[0];
                    y.parentNode.insertBefore(t, y);
                })(window, document, 'clarity', 'script', 'hcm0fy9t3g');
            </script>
            <!-- End of clarity -->
            <!-- Beamer -->
            <script>
                var beamer_config = {
                    product_id: 'KfNABJMI76508', //DO NOT CHANGE: This is your product code on Beamer
                };
            </script>
            <script
                type="text/javascript"
                src="https://app.getbeamer.com/js/beamer-embed.js"
                defer="defer"></script>
            <!-- Beamer -->
            <ui-view>
                <div class="col-12 d-flex bg-black">
                    <svg
                        class="container"
                        x="0px"
                        y="0px"
                        viewBox="0 0 50 50"
                        height="31.25"
                        width="100"
                        preserveAspectRatio="xMidYMid meet">
                        <path
                            class="track"
                            stroke-width="2"
                            fill="none"
                            pathlength="100"
                            d="M0.625 21.5 h10.25 l3.75 -5.875 l7.375 15 l9.75 -30 l7.375 20.875 v0 h10.25" />
                        <path
                            class="car"
                            stroke-width="2"
                            fill="none"
                            pathlength="100"
                            d="M0.625 21.5 h10.25 l3.75 -5.875 l7.375 15 l9.75 -30 l7.375 20.875 v0 h10.25" />
                    </svg>

                    <style>
                        .container {
                            --uib-size: 45px;
                            --uib-color: white;
                            --uib-speed: 4s;
                            --uib-bg-opacity: 0.1;
                            height: 100vh;
                            width: 113px;
                            transform-origin: center;
                            overflow: visible;
                        }

                        .car {
                            stroke: var(--uib-color);
                            stroke-dasharray: 100;
                            stroke-dashoffset: 0;
                            stroke-linecap: round;
                            stroke-linejoin: round;
                            animation: travel var(--uib-speed) ease-in-out
                                    infinite,
                                fade var(--uib-speed) ease-out infinite;
                            will-change: stroke-dasharray, stroke-dashoffset;
                            transition: stroke 0.5s ease;
                        }

                        .track {
                            stroke-linecap: round;
                            stroke-linejoin: round;
                            stroke: var(--uib-color);
                            opacity: var(--uib-bg-opacity);
                        }

                        @keyframes travel {
                            0% {
                                stroke-dashoffset: 100;
                            }

                            75% {
                                stroke-dashoffset: 0;
                            }
                        }

                        @keyframes fade {
                            0% {
                                opacity: 0;
                            }

                            20%,
                            55% {
                                opacity: 1;
                            }

                            100% {
                                opacity: 0;
                            }
                        }
                    </style>
                </div>
            </ui-view>
        </ngx-app>
        <noscript
            >Please enable JavaScript to continue using this
            application.</noscript
        >
    </body>
</html>
